name: SkillGate release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to, for example v0.1.2.
        required: true
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: resolve-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            asset: skillgate-linux-x64
            executable: skillgate
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            asset: skillgate-linux-arm64
            executable: skillgate
          - platform: darwin-x64
            runner: macos-15-intel
            asset: skillgate-darwin-x64
            executable: skillgate
          - platform: darwin-arm64
            runner: macos-14
            asset: skillgate-darwin-arm64
            executable: skillgate
          - platform: win32-x64
            runner: windows-latest
            asset: skillgate-win32-x64.exe
            executable: skillgate.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.release_tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -e . pyinstaller
      - name: Build standalone binary
        run: python -m PyInstaller --onefile --name skillgate src/skillgate/__main__.py
      - name: Smoke test standalone binary
        run: >
          python -c "from pathlib import Path; import subprocess;
          binary = (Path('dist') / '${{ matrix.executable }}').resolve();
          subprocess.run([str(binary), '--version'], check=True);
          subprocess.run([str(binary), 'rules', 'list'], check=True);
          subprocess.run([str(binary), 'review', 'preinstall', 'examples/preinstall-starter', '--format', 'json', '--output', 'test-outputs/starter-review.json'], check=True)"
      - name: Prepare release asset
        run: >
          python -c "from pathlib import Path; import shutil;
          Path('release-assets').mkdir(exist_ok=True);
          shutil.copy2(Path('dist') / '${{ matrix.executable }}',
          Path('release-assets') / '${{ matrix.asset }}')"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error
          archive: true

  publish:
    name: Publish release assets
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    # This is the only job that mutates the GitHub release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.release_tag }}
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error
      - name: Build release manifest
        run: >
          python tools/build_release_manifest.py
          --asset-dir release-assets
          --version "${{ needs.resolve-tag.outputs.release_tag }}"
          --output release-assets/skillgate-release.json
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.resolve-tag.outputs.release_tag }}" release-assets/* --clobber
      - name: Notify Personal Website of Release
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'charliechenye',
              repo: 'personal-website',
              event_type: 'skillgate-release',
              client_payload: {
                tag: '${{ needs.resolve-tag.outputs.release_tag }}'
              }
            });
