name: Generate uv lock

on:
  push:
    branches:
      - chore/uv-python312-dev-environment
    paths:
      - pyproject.toml
      - .python-version
      - .github/workflows/generate-uv-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/uv-python312-dev-environment
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.26"
          python-version: "3.12"
      - name: Generate lockfile
        run: uv lock
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Lock Python dependencies with uv"
          git push origin HEAD:chore/uv-python312-dev-environment
