name: SkillGate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  skillgate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install SkillGate
        run: uv sync --locked --group dev
      - name: Check golden snapshots
        id: snapshots
        continue-on-error: true
        run: uv run python tools/update_snapshots.py --check --artifacts test-outputs/snapshots
      - name: Upload snapshot review artifacts
        if: steps.snapshots.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-review
          path: test-outputs/snapshots
      - name: Fail on snapshot mismatch
        if: steps.snapshots.outcome == 'failure'
        run: exit 1
      - name: Run tests
        run: uv run pytest
      - name: Run lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run Node wrapper tests
        run: npm test
      - name: Scan repository
        run: uv run skillgate scan . --format text
      - name: Run deterministic demo sessions
        run: |
          uv run skillgate demo skill --output test-outputs/reviewable-demo --validate --scan
          uv run skillgate demo mcpb --output test-outputs/reviewable-node.mcpb --scan
      - name: Run policy smoke check
        run: uv run skillgate check fixtures/benchmark/01-safe-documentation-skill --policy skillgate.example.yaml
      - name: Verify benchmark fixtures
        run: uv run skillgate fixtures summary fixtures/benchmark --format text
      - name: Generate SARIF
        if: always()
        run: uv run skillgate scan . --format sarif --output skillgate.sarif
      - name: Upload SARIF review artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skillgate-sarif
          path: skillgate.sarif
          if-no-files-found: error
      - name: Upload SARIF to GitHub Code Scanning
        # Pull requests keep the full SARIF as an artifact so findings remain
        # reviewable without creating a blocking Code Scanning status check.
        if: github.event_name != 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: skillgate.sarif

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install SkillGate
        run: uv sync --locked --group dev
      - name: Run tests
        run: uv run pytest

  package-smoke:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Install release checks
        run: uv sync --locked --group dev
      - name: Build package
        run: uv build --out-dir test-outputs/dist
      - name: Check distributions
        run: uv run twine check test-outputs/dist/*
      - name: Verify typed package marker
        run: unzip -l test-outputs/dist/*.whl | grep "skillgate/py.typed"
      - name: Install wheel in a clean environment
        run: |
          python -m venv test-outputs/wheel-smoke
          uv pip install --python test-outputs/wheel-smoke/bin/python test-outputs/dist/*.whl
      - name: Run clean-install smoke tests
        run: |
          test-outputs/wheel-smoke/bin/skillgate --version
          test-outputs/wheel-smoke/bin/skillgate review schema --output test-outputs/skillgate-review.schema.json
          test-outputs/wheel-smoke/bin/skillgate review preinstall examples/preinstall-starter --format json --output test-outputs/starter-review.json
