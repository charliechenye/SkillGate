name: False positive
description: Report a finding that appears too broad or misleading.
title: "[False positive]: "
labels: ["false-positive", "triage"]
body:
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: Include the rule ID, severity, and sanitized evidence.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why it seems wrong
      description: Explain the benign behavior and what output would be more accurate.
    validations:
      required: true
  - type: textarea
    id: reduced-case
    attributes:
      label: Reduced example
      description: Paste a small synthetic example if possible. Do not paste private code or secrets.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: SkillGate version
      placeholder: "skillgate --version"
    validations:
      required: true
