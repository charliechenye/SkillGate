[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openevalgate-skillgate"
version = "0.1.1"
description = "Pre-merge and pre-install trust checks for AI-agent skills and MCP configurations. Scan capabilities, detect risky changes, and block unapproved agent behavior in CI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chenye Zhu"}]
keywords = [
  "ai-agent-security",
  "ai-agent-scanner",
  "agent-security",
  "agent-supply-chain-security",
  "mcp",
  "mcp-security",
  "mcp-security-scanner",
  "model-context-protocol",
  "model-context-protocol-security",
  "security-scanner",
  "static-analysis",
  "codex-skills",
  "claude-skills",
  "agent-skills",
  "github-code-scanning",
  "sarif",
  "policy-as-code",
  "supply-chain-security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
skillgate = "skillgate.cli:app"

[project.urls]
Homepage = "https://github.com/charliechenye/SkillGate"
Repository = "https://github.com/charliechenye/SkillGate"
Issues = "https://github.com/charliechenye/SkillGate/issues"
Changelog = "https://github.com/charliechenye/SkillGate/blob/main/CHANGELOG.md"
Documentation = "https://github.com/charliechenye/SkillGate#readme"
Security = "https://github.com/charliechenye/SkillGate/security"

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".codex",
  ".pytest_cache",
  ".pytest_tmp",
  "pytest-cache-files-*",
  "pytest-tmp",
  "test-outputs",
]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
