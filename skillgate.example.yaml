version: 1

policy:
  capabilities:
    allow:
      - "network.package_registry"
      - "shell.local_script"
    deny:
      - "network.cloud_metadata"

  shell:
    allow: false
    commands:
      allow:
        - "python samples/*"

  filesystem:
    read:
      - "docs/**"
    write:
      - "generated/**"

  network:
    allow:
      - "api.github.com"
      - "github.com"
    allow_categories:
      - "source_control"
      - "package_registry"
    deny_categories:
      - "cloud_metadata"

  secrets:
    deny:
      - "*"
    env:
      allow:
        - "GITHUB_TOKEN"

  mcp:
    require_review_on_change: true

  waivers:
    allow_broad_selectors: false
    entries: []

  risk_threshold:
    block: high
