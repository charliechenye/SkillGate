name: SkillGate
description: Run SkillGate trust checks for AI-agent skills and MCP configurations.
inputs:
  path:
    description: Repository path to scan.
    required: false
    default: "."
  policy:
    description: Policy file path.
    required: false
    default: "skillgate.example.yaml"
  baseline:
    description: Optional baseline lockfile path for diff checks.
    required: false
    default: ""
  sarif-output:
    description: Optional SARIF output path.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install SkillGate
      shell: bash
      run: python -m pip install .
    - name: Run SkillGate policy check
      shell: bash
      run: skillgate check "${{ inputs.path }}" --policy "${{ inputs.policy }}"
    - name: Run SkillGate baseline diff
      if: ${{ inputs.baseline != '' }}
      shell: bash
      run: skillgate diff "${{ inputs.path }}" --baseline "${{ inputs.baseline }}" --policy "${{ inputs.policy }}"
    - name: Generate SARIF
      if: ${{ inputs.sarif-output != '' }}
      shell: bash
      run: skillgate scan "${{ inputs.path }}" --format sarif --output "${{ inputs.sarif-output }}"
