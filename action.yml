name: SkillGate
description: Pre-merge and pre-install trust checks for AI-agent skills and MCP configurations. Scan capabilities, detect risky changes, and block unapproved agent behavior in CI.
branding:
  icon: shield
  color: purple
inputs:
  path:
    description: Repository path to scan.
    required: false
    default: "."
  policy:
    description: Policy file path in the repository being scanned. Required for blocking policy checks.
    required: false
    default: ""
  baseline:
    description: Optional baseline lockfile path for diff checks.
    required: false
    default: ""
  fail-on-drift:
    description: Exit nonzero when baseline drift is detected without requiring a policy file.
    required: false
    default: "false"
  provenance:
    description: Optional provenance manifest path for policy and baseline checksum verification.
    required: false
    default: ""
  sarif-output:
    description: Optional SARIF output path.
    required: false
    default: ""
  summary-output:
    description: Optional Markdown review summary output path.
    required: false
    default: ""
  json-output:
    description: Optional machine-readable review JSON output path.
    required: false
    default: ""
  step-summary:
    description: Append the Markdown review summary to the GitHub Step Summary.
    required: false
    default: "false"
  mcpb-path:
    description: Optional committed MCPB artifact path to scan.
    required: false
    default: ""
  mcpb-fail-on:
    description: Optional MCPB severity threshold that exits nonzero when matched.
    required: false
    default: ""
  mcpb-sarif-output:
    description: Optional MCPB SARIF output path for separate code scanning upload.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install SkillGate
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Verify SkillGate provenance
      if: ${{ inputs.provenance != '' }}
      shell: bash
      run: skillgate provenance verify --manifest "${{ inputs.provenance }}"
    - name: Run SkillGate policy check
      if: ${{ inputs.policy != '' }}
      shell: bash
      run: skillgate check "${{ inputs.path }}" --policy "${{ inputs.policy }}"
    - name: Run SkillGate scan
      if: ${{ inputs.policy == '' }}
      shell: bash
      run: skillgate scan "${{ inputs.path }}"
    - name: Run SkillGate baseline diff
      if: ${{ inputs.baseline != '' && inputs.policy != '' }}
      shell: bash
      run: skillgate diff "${{ inputs.path }}" --baseline "${{ inputs.baseline }}" --policy "${{ inputs.policy }}"
    - name: Run SkillGate baseline diff without policy
      if: ${{ inputs.baseline != '' && inputs.policy == '' && inputs.fail-on-drift != 'true' }}
      shell: bash
      run: skillgate diff "${{ inputs.path }}" --baseline "${{ inputs.baseline }}"
    - name: Run blocking SkillGate baseline diff without policy
      if: ${{ inputs.baseline != '' && inputs.policy == '' && inputs.fail-on-drift == 'true' }}
      shell: bash
      run: skillgate diff "${{ inputs.path }}" --baseline "${{ inputs.baseline }}" --fail-on-drift
    - name: Generate policy-aware SARIF
      if: ${{ always() && inputs.sarif-output != '' && inputs.policy != '' }}
      shell: bash
      run: skillgate check "${{ inputs.path }}" --policy "${{ inputs.policy }}" --format sarif --output "${{ inputs.sarif-output }}" --dry-run
    - name: Generate SARIF
      if: ${{ always() && inputs.sarif-output != '' && inputs.policy == '' }}
      shell: bash
      run: skillgate scan "${{ inputs.path }}" --format sarif --output "${{ inputs.sarif-output }}"
    - name: Run SkillGate MCPB scan
      if: ${{ inputs.mcpb-path != '' }}
      shell: bash
      run: |
        args=(mcpb scan "${{ inputs.mcpb-path }}")
        if [ "${{ inputs.mcpb-fail-on }}" != "" ]; then
          args+=(--fail-on "${{ inputs.mcpb-fail-on }}")
        fi
        skillgate "${args[@]}"
    - name: Generate MCPB SARIF
      if: ${{ always() && inputs.mcpb-path != '' && inputs.mcpb-sarif-output != '' }}
      shell: bash
      run: >
        skillgate mcpb scan "${{ inputs.mcpb-path }}"
        --format sarif
        --output "${{ inputs.mcpb-sarif-output }}"
    - name: Generate SkillGate review summary
      if: ${{ always() && (inputs.summary-output != '' || inputs.json-output != '' || inputs.step-summary == 'true') }}
      shell: bash
      run: |
        summary_output="${{ inputs.summary-output }}"
        if [ "$summary_output" = "" ]; then
          summary_output="$RUNNER_TEMP/skillgate-summary.md"
        fi
        args=(review summary "${{ inputs.path }}" --output "$summary_output")
        if [ "${{ inputs.baseline }}" != "" ]; then
          args+=(--baseline "${{ inputs.baseline }}")
        fi
        if [ "${{ inputs.policy }}" != "" ]; then
          args+=(--policy "${{ inputs.policy }}")
        fi
        if [ "${{ inputs.sarif-output }}" != "" ]; then
          args+=(--sarif-artifact "${{ inputs.sarif-output }}")
        fi
        if [ "${{ inputs.json-output }}" != "" ]; then
          args+=(--json-output "${{ inputs.json-output }}" --json-artifact "${{ inputs.json-output }}")
        fi
        skillgate "${args[@]}"
        if [ "${{ inputs.step-summary }}" = "true" ]; then
          cat "$summary_output" >> "$GITHUB_STEP_SUMMARY"
        fi
